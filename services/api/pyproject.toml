[project]
name = "venn-api"
version = "0.1.0"
description = "venn API: FastAPI, SQLAlchemy, PostgreSQL"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyjwt[crypto]>=2.9",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=1.13",
  "pgserver>=0.1.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "N"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "app.core.tenancy.require"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E501"]
"migrations/**" = ["E501", "S608"]
"scripts/**" = ["E501", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
