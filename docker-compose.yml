# Local stack: PostgreSQL with pgvector, Redis, Mailpit (catches outgoing email), and the API.
# Start the dependencies only:  docker compose up -d db redis mailpit
# Start everything:             docker compose up --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: venn
      POSTGRES_PASSWORD: venn
      POSTGRES_DB: venn
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venn"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"] # SMTP, web inbox

  api:
    build: ./services/api
    environment:
      VENN_DATABASE_URL: postgresql+psycopg://venn:venn@db:5432/venn
      VENN_REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
