name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: API types are up to date
        run: |
          npm run api:types
          git diff --exit-code -- src/types/api.d.ts
      - run: npm audit --audit-level=high --omit=dev

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: venn
          POSTGRES_PASSWORD: venn
          POSTGRES_DB: venn_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U venn" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VENN_TEST_DATABASE_URL: postgresql+psycopg://venn:venn@localhost:5432/venn_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run pytest
      - name: App imports with production dependencies only
        run: uv run --no-dev python -c "import app.main"
      - name: OpenAPI document is up to date
        run: |
          PYTHONPATH=. uv run python scripts/dump_openapi.py ../../apps/web/src/types/openapi.json
          git diff --exit-code -- ../../apps/web/src/types/openapi.json
      - run: uvx pip-audit --skip-editable -r <(uv export --frozen --no-dev --no-hashes --no-emit-project)

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Images build
        run: docker compose build api web

